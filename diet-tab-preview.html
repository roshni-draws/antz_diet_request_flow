<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diet Tablet Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!--
    Antz Modules screen (Diet only) inside iPad frames.
    Each iframe is the exact screen size (810 x 1080 and 1080 x 810, CSS px at 1x).
    The whole frame is scaled with a CSS transform to fit the window; the content inside keeps its true size.
    ?show=portrait | landscape | both   ?view=list   (passed to both screens)
  -->
  <style>
    :root {
      --page: #E9EFEB; --ink: #1F415B; --muted: #5E6B66; --white: #FFFFFF; --ring: #1F515B;
      --bezel: 28px; --bezel-c: #17191C; --ease: cubic-bezier(.2,.7,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: clip; }
    body {
      min-height: 100dvh; background: var(--page); color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 20px 24px 0; }
    .bar h1 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
    .seg { display: inline-flex; padding: 4px; gap: 4px; background: #DCE5DF; border-radius: 12px; }
    .seg button {
      min-height: 44px; padding: 0 16px; border-radius: 8px; font-size: 15px; font-weight: 500; color: #425349;
      transition: background-color 220ms var(--ease), transform 120ms var(--ease);
    }
    .seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 2px rgba(31,65,91,.08); }
    .seg button:active { transform: scale(.97); }
    .seg button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    .stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px; min-height: 0; }
    .dev { display: grid; justify-items: center; gap: 12px; }
    .dev[hidden] { display: none; }
    .dev__cap { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    /* .slot reserves the scaled footprint so the layout matches what you see */
    .slot { position: relative; }
    .frame {
      position: absolute; top: 0; left: 0; transform-origin: 0 0;
      padding: var(--bezel); background: var(--bezel-c); border-radius: 52px;
      box-shadow: inset 0 0 0 2px #2C3036, 0 2px 6px rgba(15,25,30,.18), 0 24px 60px rgba(15,25,30,.22);
    }
    .frame::before { /* front camera */
      content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #2B3138;
    }
    .frame--p::before { top: 10px; left: 50%; margin-left: -4px; }
    .frame--l::before { left: 10px; top: 50%; margin-top: -4px; }
    .screen { overflow: hidden; border-radius: 24px; clip-path: inset(0 round 24px); background: #DAE7DE; transform: translateZ(0); }
    .frame iframe { display: block; border: 0; background: #DAE7DE; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Diet module on tablet</h1>
    <div class="seg" role="group" aria-label="Orientation">
      <button type="button" data-show="both" aria-pressed="true">Both</button>
      <button type="button" data-show="portrait" aria-pressed="false">Portrait</button>
      <button type="button" data-show="landscape" aria-pressed="false">Landscape</button>
    </div>
  </div>
  <main class="stage" id="stage">
    <section class="dev" data-o="portrait" aria-label="Portrait, 810 by 1080">
      <div class="slot"><div class="frame frame--p"><div class="screen"><iframe title="Modules screen, portrait" width="810" height="1080" scrolling="no"></iframe></div></div></div>
      <p class="dev__cap">Portrait, 810 × 1080</p>
    </section>
    <section class="dev" data-o="landscape" aria-label="Landscape, 1080 by 810">
      <div class="slot"><div class="frame frame--l"><div class="screen"><iframe title="Modules screen, landscape" width="1080" height="810" scrolling="no"></iframe></div></div></div>
      <p class="dev__cap">Landscape, 1080 × 810</p>
    </section>
  </main>

  <script>
  (function () {
    'use strict';
    var qs = new URLSearchParams(location.search);
    var src = 'diet-tab-screen.html' + (qs.get('view') === 'list' ? '?view=list' : '');
    document.querySelectorAll('iframe').forEach(function (f) { f.src = src; });

    var BEZEL = 28, GAP = 40, PAD = 24, CAP = 12 + 18;
    var size = { portrait: [810 + BEZEL * 2, 1080 + BEZEL * 2], landscape: [1080 + BEZEL * 2, 810 + BEZEL * 2] };
    var stage = document.getElementById('stage'), devs = document.querySelectorAll('.dev'), btns = document.querySelectorAll('.seg button');
    var mode = 'both';

    function fit() {
      var on = mode === 'both' ? ['portrait', 'landscape'] : [mode];
      var availW = stage.clientWidth - PAD * 2 - GAP * (on.length - 1);
      var availH = window.innerHeight - stage.getBoundingClientRect().top - PAD * 2 - CAP;
      var totalW = on.reduce(function (a, o) { return a + size[o][0]; }, 0);
      var maxH = Math.max.apply(null, on.map(function (o) { return size[o][1]; }));
      var s = Math.min(1, availW / totalW, availH / maxH);
      devs.forEach(function (d) {
        var o = d.dataset.o, slot = d.querySelector('.slot'), fr = d.querySelector('.frame');
        d.hidden = on.indexOf(o) === -1;
        slot.style.width = (size[o][0] * s) + 'px';
        slot.style.height = (size[o][1] * s) + 'px';
        fr.style.transform = 'scale(' + s + ')';
      });
    }
    function show(v) {
      mode = v;
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.show === v)); });
      fit();
      try { localStorage.setItem('diet-tab-show', v); } catch (e) {}
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.show); }); });
    window.addEventListener('resize', fit);
    var start = qs.get('show');
    if (!start) { try { start = localStorage.getItem('diet-tab-show'); } catch (e) {} }
    show(['both', 'portrait', 'landscape'].indexOf(start) !== -1 ? start : 'both');
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<!-- Screen 2 - Diet home: one tabbed screen (Diet Directory | Diet by Species | Diet Request). Back: diet-module-flow.html. Routes: #directory (#directory/D-273 opens a diet), #species, #request. Directory content: V2 Tab prototype diet/directory (directory.data.js, 32 diets). Species and Request content: Antz diet tablet prototype (antz-diet.pages.dev). Visual language: that site. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       1. TOKENS
       Flow tokens (diet-module-flow.html) + Antz app tokens taken from
       the live prototype (app/tokens.css, MD3_Antz Figma styles).
       ========================================================= */
    :root {
      /* flow */
      --white: #FFFFFF;
      --status-h: 24px;
      --ring: #1F515B;
      --ease: cubic-bezier(.2,.7,.2,1);
      /* Antz app colour (MD3_Antz) */
      --md3-primary: #37BD69;
      --md3-on-surface: #006D35;
      --md3-on-primary-container: #1F515B;
      --md3-on-secondary-container: #1F415B;
      --md3-secondary: #00D6C9;
      --md3-secondary-dark: #00ABAB;
      --md3-tertiary: #FA6140;
      --md3-error: #E93353;
      --md3-add-primary: #00AFD6;
      --md3-moderate-secondary: #E4B819;
      --md3-on-tertiary-container: #250E01;
      --md3-on-surface-variant: #44544A;
      --md3-neutral-secondary: #7A8684;
      --md3-background: #EFF5F2;
      --md3-on-background: #E1F9ED;
      --md3-displaybg-primary: #E8F4F2;
      --md3-surface-variant: #DAE7DF;
      --md3-outline-variant: #C3CEC7;
      /* app aliases (diet.css) */
      --head: #000000;
      --ink: var(--md3-on-surface-variant);
      --line: rgba(0,0,0,.05);
      --neutral05: rgba(0,0,0,.05);
      --primary-a10: rgba(55,189,105,.10);
      --tertiary-a10: rgba(250,97,64,.10);
      --add-primary-a10: rgba(0,175,214,.10);
      --moderate-a10: rgba(228,184,25,.10);
      --error-a5: rgba(233,51,83,.05);
      --card-shadow: 0 2px 8px rgba(0,0,0,.08);
      --grad-greenturq: linear-gradient(116.5deg, var(--md3-secondary) 8.77%, var(--md3-primary) 101.99%);
      /* spacing (app sp scale) */
      --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-20: 20px; --sp-24: 24px; --sp-32: 32px;
      --radius: 8px;            /* app card radius */
    }

    /* =========================================================
       2. BASE  (reset + Antz text styles)
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
    body {
      background: var(--md3-background); color: var(--ink); overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; background: none; border: 0; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    [hidden] { display: none !important; }
    svg { display: block; flex: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .t-stat-title    { font-size: 28px; font-weight: 600; line-height: normal; }
    .t-major-title   { font-size: 24px; font-weight: 600; line-height: normal; }
    .t-medium-medium { font-size: 20px; font-weight: 500; line-height: normal; }
    .t-minor-title   { font-size: 16px; font-weight: 600; line-height: normal; }
    .t-minor-medium  { font-size: 16px; font-weight: 500; line-height: normal; }
    .t-minor-italic  { font-size: 16px; font-weight: 400; line-height: normal; font-style: italic; }
    .t-body-title    { font-size: 14px; font-weight: 600; line-height: normal; }
    .t-body-medium   { font-size: 14px; font-weight: 500; line-height: normal; letter-spacing: .1px; }
    .t-body-regular  { font-size: 14px; font-weight: 400; line-height: normal; }
    .t-subtext-title { font-size: 12px; font-weight: 600; line-height: normal; }

    /* =========================================================
       3. SHELL  (status bar / app bar / scrolling main)
       ========================================================= */
    .app { display: grid; grid-template-rows: var(--status-h) auto 1fr; height: 100dvh; }
    .main { overflow-y: auto; overflow-x: hidden; padding: 0 var(--sp-16) var(--sp-32); }

    /* =========================================================
       4. STATUS BAR  (same as diet-module-flow.html)
       ========================================================= */
    .status {
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      background: var(--white); color: #0E1512;
      font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .status__l { display: flex; gap: 10px; }
    .status__l span + span { font-weight: 500; }
    .status__r { display: flex; align-items: center; gap: 5px; }

    /* =========================================================
       5. APP BAR  (Antz #bar: back, title, site picker)
       ========================================================= */
    .bar {
      display: flex; align-items: center; gap: var(--sp-8);
      padding: var(--sp-16); background: var(--white); border-bottom: 1px solid var(--line);
    }
    .bar__hd { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .bar__hd h1 { color: var(--md3-on-primary-container); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar__hd p { color: var(--ink); }
    .iconbtn {
      width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none;
      color: var(--md3-on-primary-container); transition: background-color 200ms var(--ease), transform 120ms var(--ease);
    }
    @media (hover: hover) { .iconbtn:hover { background: var(--md3-displaybg-primary); } }
    .iconbtn:active { transform: scale(.94); background: var(--md3-surface-variant); }
    .sitebtn { display: flex; align-items: center; gap: var(--sp-8); height: 48px; padding: 0 var(--sp-8); color: var(--head); border-radius: 8px; }
    @media (hover: hover) { .sitebtn:hover { background: var(--md3-displaybg-primary); } }
    /* =========================================================
       TABS  (Antz .sdtabs: full-width, green underline)
       ========================================================= */
    .sdtabs { display: flex; margin: 0 calc(-1 * var(--sp-16)); background: var(--white); }
    .sdtabs button {
      flex: 1; height: 56px; display: flex; align-items: center; justify-content: center; gap: 4px;
      color: var(--md3-on-surface-variant); border-bottom: 3px solid transparent;
      transition: color 200ms var(--ease), border-color 200ms var(--ease);
    }
    .sdtabs button[aria-selected="true"] { color: var(--md3-primary); border-bottom-color: var(--md3-primary); }

    /* =========================================================
       SEARCH BAND  (Antz .spband: search field + filter button)
       ========================================================= */
    .spband {
      display: flex; align-items: center; gap: var(--sp-12); margin: 0 calc(-1 * var(--sp-16));
      padding: var(--sp-16) var(--sp-20); background: rgba(255,255,255,.75);
    }
    .spsearch {
      flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: var(--sp-8); padding: 12px;
      border: 1px solid var(--neutral05); border-radius: 8px; background: var(--neutral05); color: var(--md3-neutral-secondary);
    }
    .spsearch:focus-within { border-color: var(--md3-on-primary-container); background: var(--white); }
    .spsearch input { flex: 1; min-width: 0; height: 100%; color: var(--head); }
    .spsearch input::placeholder { color: var(--md3-neutral-secondary); }
    .spfilter {
      min-width: 48px; height: 48px; flex: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-4);
      padding: 0 var(--sp-12); border: 1px solid var(--neutral05); border-radius: 8px; background: var(--neutral05); color: var(--head);
      transition: background-color 200ms var(--ease), transform 120ms var(--ease);
    }
    .spfilter.on { background: var(--md3-on-primary-container); border-color: var(--md3-on-primary-container); color: var(--white); }
    .spfilter[aria-pressed="true"]:not(.on) { border-color: var(--md3-on-primary-container); background: var(--white); }
    .spfilter:active { transform: scale(.96); }

    /* filter chips (Antz .spchip: grey, dark teal when on) */
    .spchips { display: flex; flex-wrap: wrap; gap: var(--sp-12); padding: var(--sp-16) 0 0; }
    .spchip {
      height: 40px; padding: 0 var(--sp-16); border-radius: 6px; background: var(--neutral05); color: var(--md3-on-surface-variant);
      display: inline-flex; align-items: center; gap: 6px; transition: background-color 200ms var(--ease), color 200ms var(--ease);
    }
    .spchip[aria-pressed="true"] { background: var(--md3-on-primary-container); color: var(--white); }

    /* list bar (Antz .list-bar: count + sort chip) */
    .list-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12); margin: var(--sp-16) 0 var(--sp-8); }
    .list-bar h2 { color: var(--md3-on-surface-variant); }
    .chip {
      height: 40px; padding: 0 var(--sp-16); border-radius: 999px; border: 1px solid var(--md3-outline-variant);
      background: var(--white); color: var(--ink); display: inline-flex; align-items: center; gap: var(--sp-8); white-space: nowrap;
      transition: transform 120ms var(--ease);
    }
    .chip:active { transform: scale(.97); }

    /* type tags (Antz .ttag) */
    .ttag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
    .ttag.yearround { color: var(--md3-on-surface); background: var(--md3-on-background); }
    .ttag.seasonal { color: var(--md3-tertiary); background: var(--tertiary-a10); }
    .ttag.timebound { color: var(--md3-add-primary); background: var(--add-primary-a10); }
    .ttag.none { color: var(--md3-neutral-secondary); background: var(--neutral05); }

    /* status pill (Antz "Active" pill on the diet pane) */
    .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; white-space: nowrap; }
    .pill.active { color: var(--md3-on-surface); background: var(--md3-on-background); }
    .pill.inactive { color: var(--md3-neutral-secondary); background: var(--neutral05); }
    .pill.unassigned { color: var(--md3-neutral-secondary); background: transparent; border: 1px dashed var(--md3-outline-variant); }

    /* empty state (Antz .empty) */
    .empty { padding: var(--sp-32) var(--sp-24); text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-8); background: var(--white); border-radius: var(--radius); }
    .empty .ei { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--md3-background); color: var(--md3-outline-variant); margin-bottom: var(--sp-4); }
    .empty b { color: var(--head); }
    /* =========================================================
       6. HEADER CARD + MAIN TABS  (Antz Species Diet header:
       app bar, hairline, three equal tabs with a 3px underline)
       ========================================================= */
    .head { background: var(--white); position: relative; z-index: 2; }
    .head .bar { border-bottom: 1px solid var(--line); }
    .mtabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--white); }
    .mtab {
      height: 56px; display: flex; align-items: center; justify-content: center; padding: 0 var(--sp-8);
      color: var(--md3-on-surface-variant); border-bottom: 3px solid transparent; white-space: nowrap;
      transition: color 200ms var(--ease), border-color 200ms var(--ease), background-color 200ms var(--ease);
    }
    @media (hover: hover) { .mtab:hover { background: #FAFCFB; } }
    .mtab[aria-selected="true"] { color: var(--md3-primary); border-bottom-color: var(--md3-primary); }
    .pane[hidden] { display: none !important; }

    /* =========================================================
       7. SEGMENTS  (secondary filter row inside a tab body:
       Antz .spchip segmented chips, dark teal when on)
       ========================================================= */
    .segrow { display: flex; gap: var(--sp-8); padding: var(--sp-16) 0 0; overflow-x: auto; scrollbar-width: none; }
    .segrow::-webkit-scrollbar { display: none; }
    .segrow .spchip { flex: none; }
    .spchip .n { font-variant-numeric: tabular-nums; opacity: .8; }
    /* species coverage segments: full-width pill track, sub-level of the main tabs */
    .segwrap { margin: 0 calc(-1 * var(--sp-16)); padding: var(--sp-12) var(--sp-16); background: var(--white); border-top: 1px solid var(--line); }
    .seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--neutral05); }
    .seg3 button {
      min-height: 44px; padding: 0 var(--sp-8); border-radius: 9px; color: var(--md3-on-surface-variant); white-space: nowrap;
      transition: background-color 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .seg3 button[aria-selected="true"] { background: var(--white); color: var(--md3-on-primary-container); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    @media (hover: hover) { .seg3 button[aria-selected="false"]:hover { color: var(--head); } }
    .spgroups { display: grid; gap: var(--sp-8); }
    .spgroup__h { color: var(--md3-on-secondary-container); margin: var(--sp-8) 0 var(--sp-12); }
    .spgroup + .spgroup .spgroup__h { margin-top: var(--sp-16); }
    .spgroup__none { color: var(--md3-neutral-secondary); padding: var(--sp-12) 0; }
    .rowlabel { color: var(--md3-neutral-secondary); flex: none; align-self: center; min-width: 92px; }
    /* =========================================================
       8. DIRECTORY  (V2 tab prototype content in Antz app style)
       landscape: list 40% + detail 60%; portrait: list, detail opens as a panel
       ========================================================= */
    .fchips { display: flex; flex-wrap: wrap; gap: var(--sp-8); padding-top: var(--sp-12); }
    .fchip {
      display: inline-flex; align-items: center; gap: var(--sp-8); height: 40px; padding: 0 var(--sp-12) 0 var(--sp-16);
      border: 1px solid var(--md3-outline-variant); border-radius: 12px; background: var(--white); color: var(--md3-on-surface);
    }
    .linkbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 var(--sp-8); border-radius: 8px; color: var(--md3-on-surface); }
    .linkbtn[aria-disabled="true"] { color: var(--md3-neutral-secondary); }
    @media (hover: hover) { .linkbtn:hover { background: var(--md3-displaybg-primary); } }
    .dd-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-16); align-items: start; }
    .dd-detail { display: none; }
    .ddlist { display: grid; gap: var(--sp-8); }
    .ddrow {
      width: 100%; display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); min-height: 76px;
      text-align: left; background: var(--white); border-radius: var(--radius); box-shadow: inset 0 0 0 2px transparent;
      -webkit-tap-highlight-color: transparent; transition: box-shadow 200ms var(--ease), transform 120ms var(--ease);
    }
    .ddrow:active { transform: scale(.99); }
    .ddrow[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--md3-primary); }
    .ddrow__t { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .ddrow__t b { color: var(--head); }
    .ddrow__t b.off { color: var(--md3-neutral-secondary); }
    .ddrow__t .lb { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 4px; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .tag.grey { color: var(--md3-neutral-secondary); background: var(--neutral05); }
    .tag.green { color: var(--md3-on-surface); background: var(--md3-on-background); }
    .tag.orange { color: #C2401F; background: var(--tertiary-a10); }
    .tag.blue { color: #00799A; background: var(--add-primary-a10); }
    .tag.teal { color: var(--md3-on-primary-container); background: var(--md3-displaybg-primary); }
    .tag.red { color: var(--md3-error); background: var(--error-a5); }
    .ddrow .chev { transform: rotate(-90deg); color: var(--md3-on-primary-container); }

    .dpane { background: var(--white); border-radius: var(--radius); padding: var(--sp-20); display: grid; gap: var(--sp-16); }
    .dpane + .dpane { margin-top: var(--sp-16); }
    .dp-head { display: flex; align-items: flex-start; gap: var(--sp-12); }
    .dp-head .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
    .dp-id { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-8); }
    .dp-id b { color: var(--md3-on-secondary-container); }
    .dp-acts { display: flex; gap: 4px; flex: none; }
    .win { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 14px; font-weight: 500; }
    .win.current { color: var(--md3-on-surface); background: var(--md3-on-background); }
    .win.off { color: #00799A; background: var(--add-primary-a10); }
    .win.inactive { color: var(--md3-neutral-secondary); background: var(--neutral05); }
    .cert { display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12); border-radius: var(--radius); background: var(--md3-background); }
    .cert.none { background: var(--error-a5); }
    .cert__ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--white); color: var(--md3-primary); }
    .cert.none .cert__ic { color: var(--md3-error); }
    .cert__t { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .cert__t b { color: var(--head); }
    .dseg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 10px; border: 1px solid var(--md3-outline-variant); justify-self: start; }
    .dseg button { height: 36px; padding: 0 var(--sp-16); border-radius: 6px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
    .dseg button[aria-pressed="true"] { background: var(--md3-on-primary-container); color: var(--white); }

    /* items table (Antz diet pane: TIME / DAY / ITEM / DAILY AMT) */
    .dtab-wrap { border: 1px solid var(--md3-surface-variant); border-radius: var(--radius); overflow: hidden; overflow-x: auto; }
    .dtab { width: 100%; border-collapse: collapse; }
    .dtab th { background: var(--md3-surface-variant); color: var(--ink); text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; }
    .dtab th.amt, .dtab td.amt { text-align: right; }
    .dtab td { padding: 12px; vertical-align: top; border-top: 1px solid var(--md3-surface-variant); color: var(--head); }
    .dtab td + td { border-left: 1px solid var(--md3-surface-variant); }
    .dtab td.time { font-weight: 600; white-space: nowrap; }
    .dtab td.day { color: var(--ink); white-space: nowrap; }
    .dtab td.amt { font-weight: 600; white-space: nowrap; }
    .it-n { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 600; }
    .it-k { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--ink); background: var(--neutral05); border-radius: 999px; padding: 2px 8px; }
    .it-p { color: var(--ink); font-style: italic; }
    .it-parts { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--md3-surface-variant); display: grid; gap: 2px; color: var(--ink); }
    .it-parts em { color: var(--md3-neutral-secondary); }
    .it-alt { color: var(--ink); margin-top: 4px; }
    .it-alt b { color: var(--head); font-weight: 500; }
    .it-ex { color: var(--md3-neutral-secondary); margin-top: 4px; }

    /* nutrition */
    .nut { display: grid; gap: var(--sp-16); }
    .nut__help { display: flex; gap: 8px; align-items: center; color: var(--ink); }
    .nut__sec h4 { color: var(--md3-neutral-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .nut__row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .nut__row b { color: var(--head); font-variant-numeric: tabular-nums; }
    .nut__row b.zero { color: var(--md3-neutral-secondary); font-weight: 500; }
    .nut__row small { color: var(--md3-neutral-secondary); font-weight: 400; }

    /* notes, remark, change reason */
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
    .kv dt { color: var(--md3-neutral-secondary); }
    .kv dd { color: var(--head); }
    .sub h3 { color: var(--head); margin-bottom: 8px; }
    .remark { display: flex; gap: 10px; padding: var(--sp-12) var(--sp-16); border-radius: var(--radius); background: #FCF4AE; color: var(--head); }
    .remark svg { color: #8A6D00; }
    .reason { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--ink); }

    /* fed to species */
    .fed-h { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-12); }
    .fed-h h3 { flex: 1; color: var(--head); }
    .fed-tools { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-8); }
    .fed-tools .hint { flex: 1; color: var(--md3-neutral-secondary); min-width: 180px; }
    .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-12); }
    .scard { display: flex; gap: var(--sp-12); align-items: flex-start; padding: var(--sp-12); border: 1px solid var(--md3-surface-variant); border-radius: var(--radius); }
    .scard.sel { border-color: var(--md3-primary); background: rgba(55,189,105,.05); }
    .scard__ic { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--md3-surface-variant); color: var(--ink); }
    .scard__t { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .scard__t b { color: var(--head); }
    .scard__t i { color: var(--ink); }
    .scard__m { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--md3-neutral-secondary); margin-top: 4px; }
    .ck { width: 44px; height: 44px; margin: -10px -6px -10px -10px; display: grid; place-items: center; color: var(--md3-on-primary-container); flex: none; }
    .slist { display: grid; }
    .slist .scard { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; align-items: center; }

    @media (orientation: landscape) {
      .dd-split { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
      .dd-detail { display: block; position: sticky; top: var(--sp-16); max-height: calc(100dvh - var(--status-h) - 138px - 32px); overflow-y: auto; border-radius: var(--radius); }
      .sgrid { grid-template-columns: minmax(0, 1fr); }
    }

    /* =========================================================
       9. PANEL, SHEET, TOAST  (portrait diet detail, filters, feedback)
       ========================================================= */
    .dpanel { position: fixed; inset: var(--status-h) 0 0 0; z-index: 20; display: grid; grid-template-rows: auto 1fr; background: var(--md3-background);
      transform: translateX(0); transition: transform 260ms var(--ease); }
    .dpanel[hidden] { display: none; }
    .dpanel__body { overflow-y: auto; padding: var(--sp-16) var(--sp-16) var(--sp-32); }
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
    .scrim[hidden] { display: none; }
    .sheet { width: min(640px, 100%); max-height: 86dvh; overflow-y: auto; background: var(--white); border-radius: 16px 16px 0 0; padding: var(--sp-8) var(--sp-24) var(--sp-24); display: grid; gap: var(--sp-20); }
    .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--md3-outline-variant); justify-self: center; }
    .sheet__h { display: flex; align-items: center; justify-content: space-between; }
    .sheet__h h2 { color: var(--head); }
    .sheet__g { display: grid; gap: var(--sp-12); }
    .sheet__g h3 { color: var(--ink); }
    .sheet__g .chips { display: flex; flex-wrap: wrap; gap: var(--sp-8); }
    .sheet__f { display: flex; gap: var(--sp-12); }
    .btn { flex: 1; height: 48px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px; }
    .btn.pri { background: var(--md3-primary); color: var(--white); }
    .btn.sec { border: 1px solid var(--md3-outline-variant); color: var(--md3-on-primary-container); }
    .btn:active { transform: scale(.98); }
    .toast { position: fixed; left: 50%; bottom: 32px; z-index: 40; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); padding: 12px 20px; border-radius: 8px; background: var(--md3-on-primary-container); color: var(--white);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease); }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    /* =========================================================
       10. SPECIES CARDS  (Antz .spcard) + expandable diet list
       portrait: 1 column, landscape: 2 columns
       ========================================================= */
    .spcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-12); align-items: start; }
    .spwrap { background: var(--white); border-radius: var(--radius); overflow: hidden; }
    .spcard {
      width: 100%; display: flex; align-items: center; gap: var(--sp-16); padding: var(--sp-16) var(--sp-20); min-height: 96px; text-align: left;
      -webkit-tap-highlight-color: transparent; transition: background-color 200ms var(--ease);
    }
    @media (hover: hover) { .spcard:hover { background: #FAFCFB; } }
    .spcard:active { background: var(--md3-background); }
    .spav { width: 60px; height: 60px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--md3-surface-variant); color: var(--ink); }
    .spcard .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .spcard .n { color: var(--head); }
    .spcard .m { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spcard .c { color: var(--md3-neutral-secondary); }
    .spn { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
    .spn .v { color: var(--head); font-variant-numeric: tabular-nums; }
    .spn .l { color: var(--ink); }
    .spn .gap { color: var(--md3-tertiary); }
    .spcard .chev { color: var(--md3-on-primary-container); transition: transform 200ms var(--ease); }
    .spcard[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .spdiets { border-top: 1px solid var(--line); padding: var(--sp-8) var(--sp-20) var(--sp-16); display: grid; gap: 0; }
    .sprow { display: grid; grid-template-columns: 124px 1fr auto; align-items: center; gap: var(--sp-12); padding: var(--sp-12) 0; border-bottom: 1px solid var(--line); }
    .sprow:last-of-type { border-bottom: 0; }
    .sprow .ttag { justify-self: start; }
    .sprow .t { min-width: 0; display: grid; gap: 2px; }
    .sprow .t b { color: var(--head); }
    .sprow .t span { color: var(--ink); }
    .spmore { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 44px; margin-top: var(--sp-4); color: var(--md3-on-surface); }
    .spmore svg { transform: rotate(-90deg); }
    .spnone { padding: var(--sp-12) 0 var(--sp-4); color: var(--ink); }
    @media (orientation: landscape) { .spcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    /* =========================================================
       11. REQUEST CARDS  (Antz .hdcard: id, species, where, priority ribbon, body, status band)
       portrait: 1 column, landscape: 2 columns
       ========================================================= */
    .rqcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-16); align-items: start; }
    .hdcard { display: flex; flex-direction: column; border-radius: var(--radius); background: var(--white); box-shadow: var(--card-shadow); overflow: hidden; }
    .hd-top { display: flex; align-items: flex-start; gap: var(--sp-12); padding: var(--sp-12) 0 var(--sp-12) var(--sp-16); border-bottom: 1px solid var(--line); }
    .hd-top .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .hd-id { color: var(--md3-on-secondary-container); }
    .hd-cat { color: var(--md3-neutral-secondary); }
    .hd-where { color: var(--md3-on-surface-variant); }
    .ribbon {
      flex: none; min-width: 56px; height: 40px; padding: 0 var(--sp-12) 0 var(--sp-20); display: grid; place-items: center;
      color: var(--white); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%); margin-top: var(--sp-4);
      font-size: 20px; font-weight: 700; letter-spacing: 1px;
    }
    .ribbon.low { background: var(--md3-secondary); }
    .ribbon.medium { background: var(--md3-secondary-dark); }
    .ribbon.high { background: var(--md3-tertiary); }
    .hd-body { display: flex; flex-direction: column; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); }
    .hd-title { color: var(--head); }
    .hd-text { color: var(--md3-on-surface-variant); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hd-by { color: var(--md3-on-surface-variant); }
    .hd-by b { color: var(--md3-on-secondary-container); }
    .hdcard.struck .hd-title, .hdcard.struck .hd-text { text-decoration: line-through; }
    .hd-band { display: flex; align-items: center; gap: var(--sp-8); margin: 0 2px 2px; padding: var(--sp-8) 14px; min-height: 48px; border-radius: 0 0 6px 6px; }
    .hd-band.wait { background: var(--moderate-a10); color: var(--md3-on-tertiary-container); }
    .hd-band.wait svg { color: var(--md3-moderate-secondary); }
    .hd-band.ok { background: var(--primary-a10); color: var(--md3-on-surface); }
    .hd-band.ok svg { color: var(--md3-primary); }
    .hd-band.bad { background: var(--error-a5); color: var(--md3-error); }
    .list-bar { margin-top: var(--sp-16); }
    @media (orientation: landscape) {
      .rqcards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hd-title { font-size: 18px; }
    }
    /* =========================================================
       12. SPECIES DETAIL  (Dev system by-species detail in Antz app style)
       landscape: list 40% + detail 60%; portrait: detail opens as a panel
       ========================================================= */
    .sp-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-16); align-items: start; }
    .sp-detail { display: none; }
    .spcard[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--md3-primary); border-radius: var(--radius); }
    .spcard .go { color: var(--md3-on-primary-container); transform: rotate(-90deg); }
    .spcard .tagc { margin-top: 4px; }
    /* species header card: name + primary action / stats + secondary actions (container-query layout) */
    .sreqs__h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sreqs__h h3 { color: var(--md3-neutral-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .sreqs__need { display: flex; align-items: center; gap: 8px; color: #8A5A00; background: var(--moderate-a10); padding: 8px 12px; border-radius: 8px; }
    .sreqs__sub { color: var(--md3-neutral-secondary); }
    .sreq { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 12px 10px 0; text-align: left; border-radius: 8px; background: var(--md3-background); overflow: hidden; }
    .sreq .ribbon { margin: 0; min-width: 48px; height: 36px; font-size: 16px; padding: 0 8px 0 16px; }
    .sreq .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .sreq .grow b { color: var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sreq .grow span, .sreq .grow small { color: var(--ink); }
    .sreq .grow small { color: var(--md3-neutral-secondary); }
    .sreq .grow small.nx { color: var(--md3-on-primary-container); }
    .sreq .grow small.dx { display: inline-flex; align-items: center; gap: 4px; color: var(--head); }
    .hbtn .hcount { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--md3-displaybg-primary); color: var(--md3-on-primary-container); }
    .hero__sec .hbtn.due { border-color: #E2B33C; background: #FFF6DB; color: #6B4E00; }
    .hero__sec .hbtn.due svg { color: #8A5A00; }
    .hbtn.due .hcount { background: #8A5A00; color: var(--white); }
    .hseg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hseg .n { margin-left: 4px; opacity: .75; font-variant-numeric: tabular-nums; }
    .hseg .hdot { margin-left: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: #8A5A00; color: var(--white); }
    .hreqs { display: grid; gap: 8px; }
    .hreqs__tab { justify-self: start; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; margin-top: 4px; }
    .hfrom { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-top: 4px; padding: 0 8px; border-radius: 6px; background: var(--moderate-a10); color: #6B4E00; font-size: 13px; }
    @media (hover: hover) { .sreq:hover { background: var(--md3-displaybg-primary); } }
    .hero { background: var(--white); border-radius: var(--radius); padding: var(--sp-20) var(--sp-24); container-type: inline-size; container-name: hero; }
    .hero__in { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "top cta" "row row"; column-gap: var(--sp-16); row-gap: var(--sp-16); align-items: center; }
    .hero__top { grid-area: top; display: flex; gap: var(--sp-16); align-items: center; min-width: 0; }
    .hero__av { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--md3-surface-variant); color: var(--ink); }
    .hero__nm { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .hero__nm b { color: var(--md3-on-primary-container); line-height: 1.2; overflow-wrap: anywhere; }
    .hero__nm i { color: var(--ink); }
    .hero__nm small { color: var(--md3-neutral-secondary); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .hero__cta { grid-area: cta; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .hero__req { flex: none; min-height: 48px; padding: 0 var(--sp-20); border-radius: 8px; background: var(--md3-on-primary-container); color: var(--white); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap; transition: background-color 200ms var(--ease), transform 120ms var(--ease); }
    @media (hover: hover) { .hero__req:hover { background: #183F47; } }
    .hero__req:active { transform: scale(.98); }
    .hero__row { grid-area: row; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-16); padding-top: var(--sp-16); border-top: 1px solid var(--line); }
    .hero__stats { display: flex; align-items: stretch; }
    .hero__stats .stx { display: grid; gap: 2px; align-content: center; min-width: 88px; padding: 0 var(--sp-20); border-left: 1px solid var(--line); }
    .hero__stats .stx:first-child { padding-left: 0; border-left: 0; }
    .hero__stats .stx .v { color: var(--md3-on-secondary-container); line-height: 1.1; }
    .hero__stats .stx.ok .v { color: var(--md3-on-surface); }
    .hero__stats .stx .l { color: var(--ink); white-space: nowrap; }
    .hero__sec { display: flex; gap: var(--sp-8); flex: none; }
    .hero__sec .chip { min-height: 44px; border-radius: 8px; }
    @container hero (max-width: 640px) {
      .hero__row { flex-direction: column; align-items: stretch; gap: var(--sp-16); }
      .hero__stats .stx { flex: 1; min-width: 0; }
      .hero__sec .chip { flex: 1; justify-content: center; }
    }
    @container hero (max-width: 520px) {
      .hero__in { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "row" "cta"; }
      .hero__cta { align-items: stretch; flex-direction: column-reverse; }
      .hero__req { width: 100%; }
      .hero__cta .rqb { align-self: center; }
    }
    .card2 { background: var(--white); border-radius: var(--radius); padding: var(--sp-16) var(--sp-20); display: grid; gap: var(--sp-12); margin-top: var(--sp-16); }
    .card2 > h3, .cap3 { color: var(--md3-neutral-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .scopes { display: flex; flex-wrap: wrap; gap: var(--sp-8); }
    .scopes .spchip { flex-direction: column; align-items: flex-start; justify-content: center; height: auto; min-height: 52px; padding: 6px 14px; gap: 0; }
    .scopes .spchip small { font-size: 12px; font-weight: 400; opacity: .85; }
    .targets { display: grid; gap: 6px; align-content: start; }
    .ttools { display: grid; gap: var(--sp-8); }
    .ttools .spsearch { height: 48px; }
    .ttools .spsearch input:focus-visible { outline: none; }
    .tchips { padding: 0; align-items: center; }
    .tdiv { width: 1px; height: 24px; background: var(--md3-outline-variant); flex: none; margin: 0 4px; }
    .tcount { color: var(--md3-neutral-secondary); }
    .tbox { position: relative; border-radius: 8px; }
    .tbox::before, .tbox::after { content: ""; position: absolute; left: 0; right: 0; height: 20px; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 160ms var(--ease); }
    .tbox::before { top: 24px; background: linear-gradient(rgba(31,65,91,.12), rgba(31,65,91,0)); border-radius: 8px 8px 0 0; }
    .tbox::after { bottom: 0; background: linear-gradient(rgba(31,65,91,0), rgba(31,65,91,.12)); border-radius: 0 0 8px 8px; }
    .tbox.ft::before, .tbox.fb::after { opacity: 1; }
    .tscroll { max-height: 360px; overflow-y: auto; overscroll-behavior: contain; padding: 0 4px 4px 0; scrollbar-width: thin; }
    .tscroll .tgh { position: sticky; top: 0; z-index: 1; background: var(--white); padding: 6px 0 4px; margin: 0; }
    .tgt .tid { color: var(--md3-neutral-secondary); font-weight: 400; }
    .tgt mark, .tgh mark { background: rgba(55,189,105,.22); color: inherit; border-radius: 2px; }
    .tmore { justify-self: center; margin: 6px 0; }
    .tempty { display: grid; justify-items: center; gap: 6px; padding: var(--sp-24) var(--sp-12); text-align: center; color: var(--ink); }
    .tempty b { color: var(--head); }
    .tgh { color: var(--md3-neutral-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
    .tgt { display: flex; align-items: center; gap: var(--sp-12); min-height: 52px; padding: 8px 12px; border-radius: 8px; background: var(--md3-background); text-align: left; width: 100%; }
    .tgt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--md3-primary); background: var(--white); }
    .tgt .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .tgt .grow b { color: var(--head); }
    .tgt .grow span { color: var(--md3-neutral-secondary); }
    .tgt .d { color: var(--md3-on-surface); white-space: nowrap; }
    .tgt .d.none { color: var(--md3-neutral-secondary); }
    .pchips { display: flex; flex-wrap: wrap; gap: var(--sp-8); align-items: center; }
    .pchip { display: grid; gap: 2px; padding: 8px 12px; min-height: 48px; border-radius: 8px; border: 1px solid var(--md3-outline-variant); background: var(--white); text-align: left; }
    .pchip[aria-pressed="true"] { border-color: var(--md3-primary); box-shadow: 0 0 0 1px var(--md3-primary); background: rgba(55,189,105,.05); }
    .pchip.off { opacity: .6; }
    .pchip .l1 { display: flex; align-items: center; gap: 8px; color: var(--head); font-weight: 600; }
    .pchip .l2 { color: var(--md3-neutral-secondary); font-size: 12px; }
    .addchip { width: 48px; height: 48px; border-radius: 8px; border: 1px dashed var(--md3-outline-variant); display: grid; place-items: center; color: var(--md3-on-primary-container); }
    .switch { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); }
    .switch .trk { width: 36px; height: 20px; border-radius: 10px; background: var(--md3-outline-variant); position: relative; transition: background-color 200ms var(--ease); }
    .switch .trk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--white); transition: transform 200ms var(--ease); }
    .switch[aria-pressed="true"] .trk { background: var(--md3-primary); }
    .switch[aria-pressed="true"] .trk::after { transform: translateX(16px); }
    .callout { background: var(--white); border-radius: var(--radius); padding: var(--sp-32) var(--sp-24); margin-top: var(--sp-16); display: grid; justify-items: center; gap: var(--sp-8); text-align: center; }
    .callout .ei { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--md3-background); color: var(--md3-on-primary-container); margin-bottom: 4px; }
    .callout b { color: var(--head); }
    .callout p { color: var(--ink); max-width: 56ch; }
    .callout .btn { flex: none; padding: 0 var(--sp-20); margin-top: var(--sp-8); text-decoration: none; }
    .menu { position: fixed; z-index: 35; min-width: 220px; background: var(--white); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.16); padding: 6px; display: grid; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 6px; text-align: left; color: var(--head); }
    .menu button:hover { background: var(--md3-background); }
    .menu button.danger { color: var(--md3-error); }
    .htab { width: 100%; border-collapse: collapse; }
    .htab th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); background: var(--md3-surface-variant); padding: 8px 10px; }
    .htab td { padding: 10px; border-top: 1px solid var(--md3-surface-variant); vertical-align: top; color: var(--head); }
    .htab td small { display: block; color: var(--md3-neutral-secondary); }
    .shgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-12); }
    .shcard .link { color: var(--md3-on-surface); text-align: left; }
    @media (orientation: landscape) {
      .tscroll { max-height: 296px; }
      .sp-split { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
      .sp-split .spcards { grid-template-columns: minmax(0, 1fr); }
      .sp-detail { display: block; position: sticky; top: var(--sp-16); max-height: calc(100dvh - var(--status-h) - 138px - 32px); overflow-y: auto; border-radius: var(--radius); }
      .sp-detail .card2:first-child, .sp-detail .hero + .card2 { margin-top: var(--sp-16); }
      .shgrid { grid-template-columns: minmax(0, 1fr); }
    }
    /* =========================================================
       13. ADD A DIET  (create wizard, item sheet, diet picker, kind menu)
       ========================================================= */
    .wiz { position: fixed; inset: var(--status-h) 0 0 0; z-index: 25; display: grid; grid-template-rows: auto auto 1fr auto; background: var(--md3-background); }
    .wiz[hidden] { display: none; }
